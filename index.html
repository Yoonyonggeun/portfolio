<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Product Film Studio — Portfolio</title>
    <meta name="description" content="AI 생성 에셋으로 만드는 스크롤 필름 상세페이지·브랜드 사이트. KLANG, KONTAKT, UMBRA, AURUM, NOKTURN." />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!--
      테마를 첫 페인트 '전에' 확정한다. React가 붙기를 기다리면 밝은 화면이
      한 프레임 번쩍인 뒤 어두워진다(FOUC). 이 스크립트는 반드시 동기이고
      스타일시트보다 먼저 실행되어야 한다.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pf-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
