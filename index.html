<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PRODUCT FILM — 부수지 않고, 속을 보여준다</title>
    <meta
      name="description"
      content="찍을 실물이 없는 제품의 분해도·단면·내부 구조를 카메라 없이 만듭니다. 스크롤 필름 제품 페이지 4편 — AURUM, KLANG, KONTAKT, UMBRA."
    />
    <link rel="canonical" href="https://example.com/" />

    <!-- 링크가 카톡·슬랙에 붙었을 때 첫인상. 없으면 회색 카드로 뜬다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="부수지 않고, 속을 보여준다" />
    <meta
      property="og:description"
      content="촬영을 대신하지 않습니다. 촬영으로 못 찍는 컷을 만듭니다. 제품 필름 4편."
    />
    <meta property="og:image" content="/assets/umbra/hi_exploded.webp" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      /* 리빌의 숨김 상태를 여는 스위치. 이 줄이 실행되지 않으면 .pf-rv는
         숨겨지지 않는다. 첫 페인트 전에 걸려야 하므로 인라인·블로킹이다. */
      document.documentElement.classList.add("pf-js");

      /*
       * 무렵(07) 전용 테마 부트스트랩. 첫 페인트 전에 동기로 돌아야 다크로
       * 들어갈 때 흰 화면이 한 프레임 번쩍이지 않는다. type="module"이면
       * defer 취급이라 늦으므로 반드시 일반 스크립트로 둔다.
       *
       * 07 라우트에서만 의미가 있지만 값을 미리 읽어두는 건 무해하다.
       * 실제 data-theme 부착·제거는 MuryeopPage가 마운트/언마운트에서 한다.
       */
      try {
        var t = null;
        try {
          t = localStorage.getItem("muryeop-theme");
        } catch (e) {
          /* 사파리 프라이빗 등 localStorage 접근 자체가 던지는 환경 */
        }
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        window.__muryeopTheme = t;

        /*
         * 07만 테마를 갖는다. 다른 여섯 페이지는 명도가 고정된 디자인이라
         * color-scheme이 새면 스크롤바만 반대로 뒤집힌다. 그래서 라우트를
         * 직접 확인하고, CSS를 기다리지 않게 인라인 스타일로 같이 박는다
         * — muryeop.css는 lazy 청크라 첫 페인트에 늦는다.
         */
        if (location.pathname === "/work/muryeop") {
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
