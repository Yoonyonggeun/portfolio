<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PRODUCT FILM — 부수지 않고, 속을 보여준다</title>
    <meta
      name="description"
      content="찍을 실물이 없는 제품의 분해도·단면·내부 구조를 카메라 없이 만듭니다. 자체 기획 10편 — AURUM, KLANG, KONTAKT, UMBRA, 정본치과, MERIDIAN, 무렵, NOKTURN, 불목, 석리."
    />
    <link rel="canonical" href="https://example.com/" />

    <!-- 링크가 카톡·슬랙에 붙었을 때 첫인상. 없으면 회색 카드로 뜬다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="부수지 않고, 속을 보여준다" />
    <meta
      property="og:description"
      content="촬영을 대신하지 않습니다. 촬영으로 못 찍는 컷을 만듭니다. 자체 기획 10편."
    />
    <meta property="og:image" content="/assets/umbra/hi_exploded.webp" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      /* 리빌의 숨김 상태를 여는 스위치. 이 줄이 실행되지 않으면 .pf-rv는
         숨겨지지 않는다. 첫 페인트 전에 걸려야 하므로 인라인·블로킹이다. */
      document.documentElement.classList.add("pf-js");

      /*
       * 테마를 가진 페이지의 부트스트랩. 첫 페인트 전에 동기로 돌아야 다크로
       * 들어갈 때 흰 화면이 한 프레임 번쩍이지 않는다. type="module"이면
       * defer 취급이라 늦으므로 반드시 일반 스크립트로 둔다.
       *
       * 테마는 전역이 아니라 페이지 단위다. 무렵(07)과 NOKTURN(08)만 테마를
       * 갖고, 나머지 여섯 페이지는 명도가 고정된 디자인이라 color-scheme이
       * 새면 스크롤바만 반대로 뒤집힌다. 그래서 라우트를 직접 확인하고,
       * CSS를 기다리지 않게 인라인 스타일로 같이 박는다 — 각 페이지 CSS는
       * lazy 청크라 첫 페인트에 늦는다.
       *
       * 실제 data-theme 부착·제거는 각 페이지가 마운트/언마운트에서 한다.
       * 기본값은 페이지마다 다르다: 무렵은 OS 설정을 따라가고, NOKTURN은
       * '심야'가 그 영화제의 기본 상태라 dark로 연다.
       */
      var THEMED = {
        "/work/muryeop": { key: "muryeop-theme", global: "__muryeopTheme", fallback: "system" },
        "/work/nokturn": { key: "nokturn-theme", global: "__nokturnTheme", fallback: "dark" },
      };
      try {
        for (var path in THEMED) {
          var cfg = THEMED[path];
          var t = null;
          try {
            t = localStorage.getItem(cfg.key);
          } catch (e) {
            /* 사파리 프라이빗 등 localStorage 접근 자체가 던지는 환경 */
          }
          if (t !== "light" && t !== "dark") {
            t =
              cfg.fallback === "system"
                ? matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : cfg.fallback;
          }
          window[cfg.global] = t;

          if (location.pathname === path) {
            document.documentElement.dataset.theme = t;
            document.documentElement.style.colorScheme = t;
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
